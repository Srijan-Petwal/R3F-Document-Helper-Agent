[project]
name = "document-helper-rag-based-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srijan-Petwal", email = "srijan8a@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "black>=26.5.1",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "isort>=9.0.1",
    "jinja2>=3.1.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.8",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchainhub>=0.1.21",
    "langsmith>=0.12.5",
    "nltk>=3.10.3",
    "openai>=3.14.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "streamlit-chat>=0.1.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.6",
    "uvicorn>=0.53.0",
]

[project.scripts]
document-helper-rag-based-agent = "document_helper_rag_based_agent:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
